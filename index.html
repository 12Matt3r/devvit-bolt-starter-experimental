    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Define shader sources for different effects
            const vsSource = ` attribute vec4 a_position; attribute vec2 a_texCoord; varying vec2 v_texCoord; void main() { gl_Position = a_position; v_texCoord = a_texCoord; } `;

            const all_uniforms = `
                uniform sampler2D u_webcamTexture; uniform sampler2D u_previousFrameTexture;
                uniform float u_time; uniform float u_motionThreshold; uniform float u_trailPersistence;
                uniform float u_hueShiftSpeed; uniform float u_motionExtrapolation;
                uniform float u_intensity; uniform float u_displacement; uniform float u_feedback;
                uniform float u_threshold; uniform float u_brightness; uniform float u_contrast; uniform float u_saturation;
            `;
            const helper_functions = `
                float random (vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123 + u_time * 0.01); }
                float noise (vec2 st) { vec2 i = floor(st); vec2 f = fract(st); float a = random(i); float b = random(i + vec2(1.,0.)); float c = random(i + vec2(0.,1.)); float d = random(i + vec2(1.,1.)); vec2 u = f*f*(3.0-2.0*f); return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y; }
                vec3 rgb2hsl(vec3 color) { float r = color.r; float g = color.g; float b = color.b; float maxC = max(max(r, g), b); float minC = min(min(r, g), b); float h = 0.0, s = 0.0, l = (maxC + minC) / 2.0; if (maxC == minC) { h = s = 0.0; } else { float d = maxC - minC; s = l > 0.5 ? d / (2.0 - maxC - minC) : d / (maxC + minC); if (maxC == r) { h = (g - b) / d + (g < b ? 6.0 : 0.0); } else if (maxC == g) { h = (b - r) / d + 2.0; } else if (maxC == b) { h = (r - g) / d + 4.0; } h /= 6.0; } return vec3(h, s, l); }
                float hue2rgb(float p, float q, float t) { if(t < 0.0) t += 1.0; if(t > 1.0) t -= 1.0; if(t < 1.0/6.0) return p + (q - p) * 6.0 * t; if(t < 1.0/2.0) return q; if(t < 2.0/3.0) return p + (q - p) * (2.0/3.0 - t) * 6.0; return p; }
                vec3 hsl2rgb(vec3 hsl) { float h = hsl.x; float s = hsl.y; float l = hsl.z; float r, g, b; if(s == 0.0){ r = g = b = l; } else { float q = l < 0.5 ? l * (1.0 + s) : l + s - l * s; float p = 2.0 * l - q; r = hue2rgb(p, q, h + 1.0/3.0); g = hue2rgb(p, q, h); b = hue2rgb(p, q, h - 1.0/3.0); } return vec3(r, g, b); }
                vec3 adjustBrightnessContrast(vec3 color, float brightness, float contrast) { vec3 result = color + brightness; result = (result - 0.5) * contrast + 0.5; return clamp(result, 0.0, 1.0); }
                vec3 adjustSaturation(vec3 color, float saturation) { vec3 gray = vec3(dot(color, vec3(0.2126, 0.7152, 0.0722))); return mix(gray, color, saturation); }
            `;

            const datamoshShader = `precision highp float; varying vec2 v_texCoord; ${all_uniforms} ${helper_functions} void main() {
                vec2 mirroredTexCoord = vec2(1.0 - v_texCoord.x, v_texCoord.y);
                vec4 currentWebcamColor = texture2D(u_webcamTexture, mirroredTexCoord);
                vec4 previousOrStaticColor = texture2D(u_previousFrameTexture, v_texCoord);
                float difference = length(currentWebcamColor.rgb - previousOrStaticColor.rgb);
                vec4 finalColor; vec4 motionDerivedColor; vec4 staticDerivedColor;
                float displacementAmount = u_displacement * (1.0 + u_intensity * 2.0);
                vec2 R_offset = vec2(random(mirroredTexCoord.yx + u_time * 0.1) - 0.5) * displacementAmount;
                vec2 B_offset = vec2(random(mirroredTexCoord.xy - u_time * 0.1) - 0.5) * displacementAmount;
                motionDerivedColor = vec4(texture2D(u_webcamTexture, mirroredTexCoord + R_offset).r, currentWebcamColor.g, texture2D(u_webcamTexture, mirroredTexCoord + B_offset).b, 1.0);
                vec2 smearOffset = vec2(noise(v_texCoord*8.0 + u_time*0.05)-0.5) * 0.003 * (1.0 + u_feedback * 3.0);
                vec4 smearedPreviousOrStatic = texture2D(u_previousFrameTexture, v_texCoord + smearOffset);
                float adjustedTrailPersistence = clamp(u_trailPersistence * (1.0 + u_intensity * 0.5), 0.0, 1.0);
                staticDerivedColor = mix(currentWebcamColor, smearedPreviousOrStatic, clamp(adjustedTrailPersistence, 0.0, 1.0));
                if (difference > u_motionThreshold) { finalColor = mix(staticDerivedColor, motionDerivedColor, 0.85 * (1.0 + u_intensity * 0.3)); } else { finalColor = staticDerivedColor; }
                if (u_motionExtrapolation > 0.0) {
                    vec2 pseudoVelocityOffset = vec2(noise(v_texCoord*8.0 + u_time*0.05)-0.5) * 0.003 * (1.0 + u_feedback);
                    vec2 extrapolatedCoord = v_texCoord + pseudoVelocityOffset * u_motionExtrapolation;
                    vec4 extrapolatedColor = texture2D(u_previousFrameTexture, extrapolatedCoord);
                    float extrapolationMix = u_motionExtrapolation * smoothstep(u_motionThreshold + 0.05, u_motionThreshold - 0.05, difference);
                    extrapolationMix = clamp(extrapolationMix, 0.0, 0.9);

            async function setupMediaSource(type, options = {}) {

                if (video.srcObject) { video.srcObject.getTracks().forEach(track => track.stop()); video.srcObject = null; }

                if (type === 'webcam') {
                    currentInputSource = 'webcam';
                    useWebcamButton.style.display = 'none';
                    try {
                        const constraints = { video: { facingMode: options.facingMode || 'user' } };
                        const stream = await navigator.mediaDevices.getUserMedia(constraints);
                        video.srcObject = stream;
                        await video.play();
                        currentFacingMode = options.facingMode || 'user';
                        mediaReady = true;
                    } catch (err) {
                        showError(`Webcam error: ${err.message}`, !options.isSwitching);
                        mediaReady = false;
                    }
                } else if (type === 'file' && options.file) {
                    currentInputSource = 'file';
                    const url = URL.createObjectURL(options.file);
                    const isImage = options.file.type.startsWith('image/');

                    if (isImage) {
                        uploadedMediaElement = new Image();

                    } else {

                        uploadedMediaElement.autoplay = true; uploadedMediaElement.loop = true; uploadedMediaElement.muted = true;
                        uploadedMediaElement.playsInline = true;

                    uploadedMediaElement.src = url;
                    if(uploadedMediaElement.tagName === 'VIDEO') await uploadedMediaElement.play().catch(e => console.error("uploaded video play error", e));

                if (mediaReady) {
                    const mediaElement = currentInputSource === 'webcam' ? video : uploadedMediaElement;
                    let width, height;
                    if (mediaElement.tagName === 'VIDEO') {
                        width = mediaElement.videoWidth; height = mediaElement.videoHeight;

                        width = mediaElement.naturalWidth; height = mediaElement.naturalHeight;
                    }

                    let lastCanvasWidth = canvas.width;
                    let lastCanvasHeight = canvas.height;

                    const newCanvasWidth = Math.min(width, 1280);
                    const aspectRatio = width / height;
                    const newCanvasHeight = Math.round(newCanvasWidth / aspectRatio);

                    canvas.width = newCanvasWidth;

                recordButton.addEventListener('click', () => { if (!mediaReady && !isFrozen) { showError("Media not ready.", false); return; } if (isRecording) { stopRecording(); } else { startRecording(); } });
                switchCameraButton.addEventListener('click', async () => { const newFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user'; await setupMediaSource('webcam', { facingMode: newFacingMode, isSwitching: true }); });
                fileUploadInput.addEventListener('change', async (event) => { const file = event.target.files[0]; if (file) { await setupMediaSource('file', { file: file }); } event.target.value = null; });
                useWebcamButton.addEventListener('click', async () => { await setupMediaSource('webcam', { facingMode: currentFacingMode }); });
                soundscapeButton.addEventListener('click', handleSoundscapeButtonClick);
                narrationButton.addEventListener('click', handleNarrationButtonClick);
                autonomousButton.addEventListener('click', handleAutonomousModeToggle);
                copilotSendButton.addEventListener('click', handleCopilotCommand);
                copilotInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleCopilotCommand(); });
                 narrationIntervalSelect.addEventListener('change', () => {
                    if (isNarrating || isAutonomous) {
                        stopNarration();
                        stopAutonomousMode();
                        startNarration(isAutonomous); // Restart with new timing
                    }
                });

                shareButton.addEventListener('click', () => {
                    const link = generateShareLink();
                    const tempInput = document.createElement('textarea');
                    tempInput.value = link;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    tempInput.setSelectionRange(0, 99999);
                    try {
                        const successful = document.execCommand('copy');
                        if (successful) {
                            const originalHTML = shareButton.innerHTML; const originalTitle = shareButton.title;
                            shareButton.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
                            shareButton.title = "Copied!"; shareButton.disabled = true;
                            setTimeout(() => { shareButton.innerHTML = originalHTML; shareButton.title = originalTitle; shareButton.disabled = false; }, 2000);
                        } else { showError('Failed to copy link.', false); }
                    } catch (err) { showError('Failed to copy link.', false); }
                    document.body.removeChild(tempInput);
                });

                resizeHandle.addEventListener('mousedown', (e) => { if (controlsPanel.classList.contains('minimized')) return; isResizing = true; startX = e.clientX; startY = e.clientY; startWidth = controlsPanel.offsetWidth; startHeight = controlsPanel.offsetHeight; controlsPanel.style.userSelect = 'none'; controlsPanel.style.pointerEvents = 'none'; window.addEventListener('mousemove', handleMouseMove); window.addEventListener('mouseup', handleMouseUp); e.preventDefault(); });
                function handleMouseMove(e) { if (!isResizing) return; const dx = e.clientX - startX; const dy = e.clientY - startY; let newWidth = startWidth + dx; let newHeight = startHeight + dy; newWidth = Math.max(240, newWidth); newHeight = Math.max(150, newHeight); controlsPanel.style.width = `${newWidth}px`; controlsPanel.style.height = `${newHeight}px`; }
                function handleMouseUp() { if (isResizing) { isResizing = false; controlsPanel.style.userSelect = ''; controlsPanel.style.pointerEvents = ''; window.removeEventListener('mousemove', handleMouseMove); window.removeEventListener('mouseup', handleMouseUp); if (!controlsPanel.classList.contains('minimized')) { controlsPanel.dataset.originalHeight = controlsPanel.offsetHeight + 'px'; } } }
                minimizeButton.addEventListener('click', () => {
                    if (controlsPanel.classList.contains('minimized')) {
                        controlsPanel.classList.remove('minimized'); minimizeButton.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>'; minimizeButton.title = "Minimize Controls";
                        controlsPanel.style.height = controlsPanel.dataset.originalHeight || 'auto';
                        controlsPanel.addEventListener('transitionend', function onMaximizeEnd(e) { if (e.propertyName === 'height') { controlsPanel.style.height = 'auto'; controlsPanel.removeEventListener('transitionend', onMaximizeEnd); } }, { once: true });
                    } else {
                        controlsPanel.dataset.originalHeight = controlsPanel.offsetHeight + 'px';
                        controlsPanel.style.height = controlsPanel.offsetHeight + 'px'; requestAnimationFrame(() => { controlsPanel.classList.add('minimized'); });
                        minimizeButton.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'; minimizeButton.title = "Maximize Controls";
                    }
                });
                controlsPanel.addEventListener('keydown', (e) => {
                    if ((e.key === 'w' || e.key === 's') && document.activeElement.type === 'number') {
                        e.preventDefault();
                        const focusableNumberInputs = Array.from(controlsContent.querySelectorAll('input[type="number"]:not([disabled])'));
                        const currentIndex = focusableNumberInputs.indexOf(document.activeElement);
                        if (currentIndex !== -1) {
                            const nextIndex = (currentIndex + (e.key === 's' ? 1 : -1) + focusableNumberInputs.length) % focusableNumberInputs.length;
                            focusableNumberInputs[nextIndex].focus();
                            focusableNumberInputs[nextIndex].select();
                        }
                    }
                });

                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
                if (isMobile && navigator.mediaDevices?.enumerateDevices) {
                    try {
                        const devices = await navigator.mediaDevices.enumerateDevices();
                        const videoInputs = devices.filter(device => device.kind === 'videoinput');
                        switchCameraButton.style.display = videoInputs.length > 1 ? 'flex' : 'none';
                    } catch (err) {
                        console.warn("Could not enumerate devices:", err);
                        switchCameraButton.style.display = isMobile ? 'flex' : 'none';
                    }
                } else { switchCameraButton.style.display = isMobile ? 'flex' : 'none'; }
                randomizeButton.addEventListener('click', randomizeControls);
                fullscreenButton.addEventListener('click', toggleFullscreen);
                await setupMediaSource('webcam', { facingMode: currentFacingMode });
            }

            function randomizeControls() {
                const excludedControls = ['history', 'hue'];
                Object.keys(controlValues).forEach(controlName => {
                    if (excludedControls.includes(controlName)) return; const config = controlConfig[controlName]; const { range, number } = getControlElements(controlName); if (!range || !number || !config) { return; }
                    const minVal = parseFloat(range.min); const maxVal = parseFloat(range.max); const stepVal = parseFloat(range.step) || 0.01;
                    if (isNaN(minVal) || isNaN(maxVal) || isNaN(stepVal) || stepVal <= 0 || minVal > maxVal) return;
                    if (minVal === maxVal) { updateControlValueFromSlider(controlName, minVal, config.precision, config.isInt); return; }
                    const numSteps = Math.round((maxVal - minVal) / stepVal); const randomStepIndex = Math.floor(Math.random() * (numSteps + 1));
                    let randomValue = minVal + randomStepIndex * stepVal; randomValue = Math.max(minVal, Math.min(maxVal, randomValue));
                    updateControlValueFromSlider(controlName, randomValue, config.precision, config.isInt);
                });
            }

            function toggleFullscreen() {
                const elem = document.documentElement;
                const iconOn = fullscreenButton.querySelector('.icon-fullscreen');
                const iconOff = fullscreenButton.querySelector('.icon-exit-fullscreen');

                if (!document.fullscreenElement) {
                    elem.requestFullscreen().catch(err => {
                        showError(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`, false);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }

            document.addEventListener('fullscreenchange', () => {
                const iconOn = fullscreenButton.querySelector('.icon-fullscreen');
                const iconOff = fullscreenButton.querySelector('.icon-exit-fullscreen');
                if (document.fullscreenElement) {
                    iconOn.classList.add('hidden');
                    iconOff.classList.remove('hidden');
                } else {
                    iconOn.classList.remove('hidden');
                    iconOff.classList.add('hidden');
                }
            });

            function stopSoundscape() {
                if (Tone.Transport.state === 'started') {
                    Tone.Transport.stop();
                    Tone.Transport.cancel(); // Remove all scheduled events
                }
                for (const key in soundscapeObjects) {
                    if (soundscapeObjects[key] && typeof soundscapeObjects[key].dispose === 'function') {
                        soundscapeObjects[key].dispose();
                    }
                    soundscapeObjects[key] = null;
                }
                isSoundscapePlaying = false;
                updateSoundscapeButton(false);
            }

            function updateSoundscapeButton(isPlaying, isGenerating = false) {
                 const playIcon = soundscapeButton.querySelector('.icon-play');
                const stopIcon = soundscapeButton.querySelector('.icon-stop');
                const spinner = soundscapeButton.querySelector('.gemini-button-spinner');

                playIcon.style.display = !isPlaying && !isGenerating ? 'block' : 'none';
                stopIcon.style.display = isPlaying && !isGenerating ? 'block' : 'none';
                spinner.style.display = isGenerating ? 'inline-block' : 'none';
                soundscapeButton.disabled = isGenerating;
            }

            async function handleSoundscapeButtonClick() {
                 if (isSoundscapePlaying) {
                    stopSoundscape();
                    return;
                }

                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }

                updateSoundscapeButton(false, true);

                try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const base64Data = dataUrl.split(',')[1];

                    const keywordsPrompt = "Analyze this abstract glitch art. Respond with a single JSON object containing a 'keywords' array of 3-5 words describing the image's atmosphere. Use words like: chaotic, serene, digital, noisy, fluid, sharp, melancholic, vibrant, electric, decaying, dreamy, harsh.";
                    const keywordsPayload = {
                        contents: [{ parts: [{ text: keywordsPrompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }],
                        generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { keywords: { type: "ARRAY", items: { type: "STRING" } } } } }
                    };
                    const keywordsResult = await geminiApiCall(keywordsPayload);
                    const keywords = JSON.parse(keywordsResult.candidates[0].content.parts[0].text).keywords;
                    if (!keywords || keywords.length === 0) throw new Error("Could not generate keywords from image.");

                    const recipeSystemPrompt = `You are an expert sound designer creating atmospheric soundscapes with Tone.js. Your response must be a valid JSON object that strictly adheres to the provided schema to control the audio synthesis engine. Be creative and map the user's keywords to the sound parameters. Ensure LFO min and max values are logical for the frequency range.`;
                    const recipeUserPrompt = `Create a sound recipe for the keywords: ${keywords.join(', ')}.`;
                    const recipePayload = {
                        contents: [{ parts: [{ text: recipeUserPrompt }] }],
                        systemInstruction: { parts: [{ text: recipeSystemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    synth: { type: "OBJECT", properties: { type: { "type": "STRING", "enum": ["sine", "square", "triangle", "sawtooth"] }, volume: { "type": "NUMBER", "minimum": -40, "maximum": 0 } } },
                                    noise: { type: "OBJECT", properties: { type: { "type": "STRING", "enum": ["white", "pink", "brown"] }, volume: { "type": "NUMBER", "minimum": -60, "maximum": -20 } } },
                                    effect: { type: "OBJECT", properties: { type: { "type": "STRING", "enum": ["reverb", "delay", "none"] }, amount: { "type": "NUMBER", "minimum": 0.1, "maximum": 0.9 } } },
                                    lfo: { type: "OBJECT", properties: { frequency: { "type": "STRING" }, min: { "type": "NUMBER" }, max: { "type": "NUMBER" } } },
                                    loopDuration: { "type": "STRING", "description": "e.g. '2m', '4m'" }
                                }
                            }
                        }
                    };
                    const recipeResult = await geminiApiCall(recipePayload);
                    const recipe = JSON.parse(recipeResult.candidates[0].content.parts[0].text);
                    if (!recipe) throw new Error("Could not generate sound recipe.");

                    stopSoundscape();

                    let lastNode = Tone.Destination;
                    if (recipe.effect && recipe.effect.type !== 'none') {
                        if (recipe.effect.type === 'reverb') {
                            soundscapeObjects.effect = new Tone.Reverb(Math.max(2, recipe.effect.amount * 10)).toDestination();
                        } else if (recipe.effect.type === 'delay') {
                            soundscapeObjects.effect = new Tone.FeedbackDelay("8n", recipe.effect.amount).toDestination();
                        }
                        lastNode = soundscapeObjects.effect;
                    }

                    if (recipe.synth) {
                        soundscapeObjects.synth = new Tone.Synth({ oscillator: { type: recipe.synth.type } }).connect(lastNode);
                        soundscapeObjects.synth.volume.value = recipe.synth.volume || -20;
                    }

                    if (recipe.noise) {
                        soundscapeObjects.noise = new Tone.Noise(recipe.noise.type).connect(lastNode);
                        soundscapeObjects.noise.volume.value = recipe.noise.volume || -40;
                    }

                    if (recipe.lfo && soundscapeObjects.synth) {
                        soundscapeObjects.lfo = new Tone.LFO(recipe.lfo.frequency, recipe.lfo.min, recipe.lfo.max).start();
                        soundscapeObjects.lfo.connect(soundscapeObjects.synth.frequency);
                    }

                    soundscapeObjects.loop = new Tone.Loop(time => {
                        if (soundscapeObjects.synth) {
                           soundscapeObjects.synth.triggerAttackRelease(recipe.lfo ? 0 : 440, recipe.loopDuration, time);
                        }
                    }, recipe.loopDuration || "2m").start(0);

                    if (soundscapeObjects.noise) {
                        soundscapeObjects.noise.start();
                    }

                    Tone.Transport.start();
                    isSoundscapePlaying = true;
                    updateSoundscapeButton(true);

                } catch (error) {
                    showError("Could not generate soundscape: " + error.message, false);
                    stopSoundscape();
                }
            }

            function updateNarrationButton(isNarrating, isGenerating = false, button = narrationButton) {
                const playIcon = button.querySelector('.icon-play');
                const stopIcon = button.querySelector('.icon-stop');
                const spinner = button.querySelector('.gemini-button-spinner');

                playIcon.style.display = !isNarrating && !isGenerating ? 'block' : 'none';
                stopIcon.style.display = isNarrating && !isGenerating ? 'block' : 'none';
                spinner.style.display = isGenerating ? 'inline-block' : 'none';
                button.disabled = isGenerating;
            }

            function handleNarrationButtonClick() {
                if (isNarrating) {
                    stopNarration();
                } else {
                    if (isAutonomous) stopAutonomousMode();
                    startNarration();
                }
            }

            function startNarration() {
                if (isNarrating) return;
                isNarrating = true;
                narrationHistory = [];
                updateNarrationButton(true);
                getNarrationLine();
                const interval = parseInt(narrationIntervalSelect.value, 10) * 1000;
                narrationIntervalId = setInterval(getNarrationLine, interval);
            }

            function stopNarration() {
                if (!isNarrating) return;
                isNarrating = false;
                clearInterval(narrationIntervalId);
                narrationIntervalId = null;
                narrationOverlay.classList.remove('visible');
                updateNarrationButton(false);
            }

            async function getNarrationLine() {
                try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const base64Data = dataUrl.split(',')[1];

                    let history = narrationHistory.join(" ");
                    if (history.length > 1000) {
                        history = history.substring(history.length - 1000);
                    }

                    const prompt = `You are a surreal narrator describing a psychedelic experience. Based on this image, provide one short, poetic, dream-like sentence to continue the narration. Don't repeat yourself. The story so far: "${history}"`;

                    const payload = {
                        contents: [ { role: "user", parts: [ { text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } } ] } ],
                    };

                    const result = await geminiApiCall(payload);
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text) {
                        const cleanText = text.replace(/["*]/g, '');
                        narrationHistory.push(cleanText);
                        displayNarrationLine(cleanText);
                        textToSpeech(cleanText);
                    }
                } catch(error) {
                    console.error("Narration Error:", error);
                    if (isNarrating) stopNarration();
                    if (isAutonomous) stopAutonomousMode();
                }
            }

            function displayNarrationLine(text) {
                const interval = parseInt(narrationIntervalSelect.value, 10);
                narrationOverlay.style.animationDuration = `${Math.max(1, interval - 2)}s`;
                narrationOverlay.textContent = text;
                narrationOverlay.classList.remove('visible');
                void narrationOverlay.offsetWidth;
                narrationOverlay.classList.add('visible');
            }

            function base64ToArrayBuffer(base64) {
                const binaryString = window.atob(base64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes.buffer;
            }

            function pcmToWav(pcmData, sampleRate) {
                const numChannels = 1;
                const bytesPerSample = 2; // 16-bit
                const blockAlign = numChannels * bytesPerSample;
                const byteRate = sampleRate * blockAlign;
                const dataSize = pcmData.length * bytesPerSample;
                const buffer = new ArrayBuffer(44 + dataSize);
                const view = new DataView(buffer);
                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + dataSize, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, byteRate, true);
                view.setUint16(32, blockAlign, true);
                view.setUint16(34, 16, true);
                writeString(view, 36, 'data');
                view.setUint32(40, dataSize, true);
                let offset = 44;
                for (let i = 0; i < pcmData.length; i++, offset += 2) {
                    view.setInt16(offset, pcmData[i], true);
                }
                return new Blob([view], { type: 'audio/wav' });
            }

             function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            async function textToSpeech(text) {
                if(!ttsToggle.checked) return;
                try {
                    const payload = {
                        contents: [{ parts: [{ text: `Say in a calm, slightly ethereal voice: ${text}` }] }],
                        generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Algieba" } } } },
                        model: "gemini-2.5-flash-preview-tts"
                    };
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) { const errorBody = await response.json(); throw new Error(`TTS API Error: ${response.status} - ${errorBody?.error?.message}`); }
                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType;

                    if (audioData && mimeType && mimeType.startsWith("audio/")) {
                        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);
                        const audio = new Audio(audioUrl);
                        audio.play();
                    } else { throw new Error("Invalid audio data received."); }
                } catch (error) { console.error("Text-to-speech failed:", error); }
            }

            // --- Autonomous Mode ---
            function handleAutonomousModeToggle() {
                if (isAutonomous) {
                    stopAutonomousMode();
                } else {
                    startAutonomousMode();
                }
            }

            function startAutonomousMode() {
                if(isAutonomous) return;
                if(isNarrating) stopNarration();
                isAutonomous = true;
                narrationHistory = [];
                if (!lastGeneratedShaderCode) {
                    lastGeneratedShaderCode = shaderSources[currentEffect] || shaderSources['datamosh'];
                }
                updateNarrationButton(true, false, autonomousButton);
                autonomousStep();
                const interval = parseInt(narrationIntervalSelect.value, 10) * 1000;
                autonomousIntervalId = setInterval(autonomousStep, interval);
            }

            function stopAutonomousMode() {
                if(!isAutonomous) return;
                isAutonomous = false;
                clearInterval(autonomousIntervalId);
                autonomousIntervalId = null;
                narrationOverlay.classList.remove('visible');
                updateNarrationButton(false, false, autonomousButton);
            }

            async function autonomousStep(){
                await evolveCurrentShader();
                await getNarrationLine();
            }

            async function evolveCurrentShader() {
                let currentShaderCode = lastGeneratedShaderCode || shaderSources[currentEffect] || shaderSources['datamosh'];
                if (!currentShaderCode) {
                    console.error("No base shader code found to evolve.");
                    return;
                }

                const systemPrompt = `You are an expert GLSL programmer. Your task is to subtly modify an existing WebGL fragment shader to create a gentle, evolving visual journey.
- Keep the core logic but introduce a small, creative change (e.g., tweak a formula, alter a color calculation, add a subtle sine wave modulation).
- The shader you return must be a complete and valid fragment shader.
- The final lines that perform color adjustments (brightness, saturation, etc.) should be preserved as in the original shader.
- You have access to these and only these uniforms: ${all_uniforms}.
- You also have access to these and only these helper functions: ${helper_functions}. Do not define new functions.
- The final color should be assigned to a vec4 variable named 'finalColor' before the final adjustments.
- The final output must be ONLY the raw, complete, modified GLSL code, without any markdown, explanations, or comments about your changes.
`;
                const userPrompt = `Here is the current shader code. Evolve it slightly:\n\n${currentShaderCode}`;

                try {
                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    };
                    const result = await geminiApiCall(payload);
                    const newShaderCode = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!newShaderCode) throw new Error("AI did not generate evolved shader code.");

                    const match = newShaderCode.match(/```(glsl\s*)?([\s\S]*?)```/);
                    const cleanedShaderCode = match ? match[2].trim() : newShaderCode.trim();

                    const tempProgram = createShaderProgram(vsSource, cleanedShaderCode);
                    if (tempProgram) {
                        lastGeneratedShaderCode = cleanedShaderCode;
                        if (shaderProgram) gl.deleteProgram(shaderProgram);
                        shaderProgram = tempProgram;
                        if (!setupMainShaderAttributesUniforms()) {
                            showError("Failed to setup evolved shader uniforms.", false);
                            changeEffect('datamosh');
                        } else {
                            currentEffect = '__ai_autonomous__';
                            effectSelector.value = '';
                            favoriteShaderButton.classList.remove('hidden');
                        }
                    } else {
                        console.error("Failed to compile the evolved shader. Skipping this step of the trip.");
                    }
                } catch (error) {
                    console.error("Shader Evolution Error:", error);
                }
            }

            main();
        });
    </script>
